name: LiveSports API - Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select the target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      target_branch:
        description: Branch to build from the private LiveSports repository
        required: true
        default: development
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-target:
    environment: ${{ inputs.environment == 'development' && 'livesports-dev' || 'livesports-production' }}
    runs-on: ubuntu-latest
    outputs:
      target_platform: ${{ steps.target.outputs.target_platform }}
    steps:
      - name: Resolve deployment target
        id: target
        env:
          TARGET_PLATFORM: ${{ vars.TARGET_PLATFORM }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          GITHUB_ENVIRONMENT: ${{ inputs.environment == 'development' && 'livesports-dev' || 'livesports-production' }}
        run: |
          echo "TARGET_PLATFORM=${TARGET_PLATFORM}"
          echo "INPUT_ENVIRONMENT=${INPUT_ENVIRONMENT}"
          echo "GITHUB_ENVIRONMENT=${GITHUB_ENVIRONMENT}"
          if [ "${TARGET_PLATFORM}" != 'WEB_APP' ] && [ "${TARGET_PLATFORM}" != 'AKS' ]; then
            echo "::error::TARGET_PLATFORM must be WEB_APP or AKS; found '${TARGET_PLATFORM}'."
            exit 1
          fi
          echo "target_platform=${TARGET_PLATFORM}" >> "$GITHUB_OUTPUT"

  build-web-app:
    if: ${{ needs.resolve-target.outputs.target_platform == 'WEB_APP' }}
    environment: ${{ inputs.environment == 'development' && 'livesports-dev' || 'livesports-production' }}
    runs-on: ubuntu-latest
    needs: resolve-target
    steps:
      - name: Checkout LiveSports
        uses: actions/checkout@v4
        with:
          repository: The-Bike-Rentals/livesports
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GET_CODE_FROM_PRIVATE_REPO }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.0'

      - name: Validate dependencies
        working-directory: livesports-python-api
        run: python -m pip install -r requirements.txt

      - name: Create deployment package
        working-directory: livesports-python-api
        run: zip -r ../release.zip . -x '.venv/*' 'antenv/*' '.git/*' '*.pyc' '__pycache__/*'

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: livesports-api
          path: release.zip

  deploy-web-app:
    if: ${{ needs.resolve-target.outputs.target_platform == 'WEB_APP' }}
    environment: ${{ inputs.environment == 'development' && 'livesports-dev' || 'livesports-production' }}
    runs-on: ubuntu-latest
    needs:
      - build-web-app
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v8
        with:
          name: livesports-api

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_WEB_APP }}

      - name: Resolve Web App resource group
        id: webapp
        env:
          APP_NAME: ${{ vars.WEB_APP_NAME }}
          WEB_APP_RESOURCE_GROUP: ${{ vars.WEB_APP_RESOURCE_GROUP }}
        run: |
          resource_group="${WEB_APP_RESOURCE_GROUP}"
          if [ -z "${resource_group}" ]; then
            resource_group=$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" -o tsv)
          fi
          if [ -z "${resource_group}" ]; then
            echo "::error::Could not resolve resource group for Web App '${APP_NAME}'."
            exit 1
          fi
          echo "resource_group=${resource_group}" >> "$GITHUB_OUTPUT"

      - name: Verify F1 App Service plan
        env:
          APP_NAME: ${{ vars.WEB_APP_NAME }}
          RG: ${{ steps.webapp.outputs.resource_group }}
        run: |
          plan_id=$(az webapp show --name "${APP_NAME}" --resource-group "${RG}" --query serverFarmId -o tsv)
          plan_sku=$(az appservice plan show --ids "${plan_id}" --query sku.name -o tsv)
          if [ "${plan_sku}" != 'F1' ]; then
            echo "::error::Development Web App '${APP_NAME}' must use the F1 tier; found '${plan_sku}'."
            exit 1
          fi

      - name: Delete existing custom App Service settings
        env:
          APP_NAME: ${{ vars.WEB_APP_NAME }}
          RG: ${{ steps.webapp.outputs.resource_group }}
        run: |
          settings=$(az webapp config appsettings list \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --query "[?!(starts_with(name, 'WEBSITE_') || starts_with(name, 'SCM_') || starts_with(name, 'DOCKER_') || starts_with(name, 'FUNCTIONS_'))].name" \
            -o tsv)
          if [ -n "${settings}" ]; then
            az webapp config appsettings delete \
              --name "${APP_NAME}" \
              --resource-group "${RG}" \
              --setting-names ${settings}
          fi

      - name: Delete existing connection strings
        env:
          APP_NAME: ${{ vars.WEB_APP_NAME }}
          RG: ${{ steps.webapp.outputs.resource_group }}
        run: |
          connection_strings=$(az webapp config connection-string list \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --query '[?name!=null].name' \
            -o tsv)
          if [ -n "${connection_strings}" ]; then
            az webapp config connection-string delete \
              --name "${APP_NAME}" \
              --resource-group "${RG}" \
              --setting-names ${connection_strings}
          fi

      - name: Configure Web App settings
        env:
          APP_NAME: ${{ vars.WEB_APP_NAME }}
          RG: ${{ steps.webapp.outputs.resource_group }}
          AZURE_SERVICE_BUS_QUEUE: ${{ vars.AZURE_SERVICE_BUS_QUEUE || 'livesports' }}
          ALGORITHM: ${{ vars.ALGORITHM || 'HS256' }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES || '60' }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.REFRESH_TOKEN_EXPIRE_DAYS || '30' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || '[]' }}
          PHONEPE_CLIENT_VERSION: ${{ vars.PHONEPE_CLIENT_VERSION || '1' }}
          PHONEPE_ENV: ${{ vars.PHONEPE_ENV || 'SANDBOX' }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT || 'development' }}
          YOUTUBE_BROADCASTER_CHANNEL_TITLE: ${{ vars.YOUTUBE_BROADCASTER_CHANNEL_TITLE || 'livesports' }}
          YOUTUBE_POST_LIVE_VIDEO_STATUS: ${{ vars.YOUTUBE_POST_LIVE_VIDEO_STATUS || 'private' }}
        run: |
          cors_origins=$(python -c "import json, os; value=os.environ['CORS_ORIGINS']; parsed=json.loads(value); assert isinstance(parsed, list), 'CORS_ORIGINS must be a JSON array'; print(json.dumps(parsed, separators=(',', ':')))" )
          az webapp config appsettings set \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --settings \
              AZURE_SERVICE_BUS_QUEUE="${AZURE_SERVICE_BUS_QUEUE}" \
              ALGORITHM="${ALGORITHM}" \
              ACCESS_TOKEN_EXPIRE_MINUTES="${ACCESS_TOKEN_EXPIRE_MINUTES}" \
              REFRESH_TOKEN_EXPIRE_DAYS="${REFRESH_TOKEN_EXPIRE_DAYS}" \
              CORS_ORIGINS="${cors_origins}" \
              PHONEPE_CLIENT_VERSION="${PHONEPE_CLIENT_VERSION}" \
              PHONEPE_ENV="${PHONEPE_ENV}" \
              BACKEND_BASE_URL="${BACKEND_BASE_URL}" \
              FRONTEND_BASE_URL="${FRONTEND_BASE_URL}" \
              ENVIRONMENT="${APP_ENVIRONMENT}" \
              YOUTUBE_BROADCASTER_CHANNEL_TITLE="${YOUTUBE_BROADCASTER_CHANNEL_TITLE}" \
              YOUTUBE_POST_LIVE_VIDEO_STATUS="${YOUTUBE_POST_LIVE_VIDEO_STATUS}"

      - name: Configure Web App secrets
        env:
          APP_NAME: ${{ vars.WEB_APP_NAME }}
          RG: ${{ steps.webapp.outputs.resource_group }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AZURE_SERVICE_BUS_CONNECTION_STRING: ${{ secrets.AZURE_SERVICE_BUS_CONNECTION_STRING }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MESSAGING_API_URL: ${{ secrets.MESSAGING_API_URL }}
          MESSAGING_API_SESSION: ${{ secrets.MESSAGING_API_SESSION }}
          MESSAGING_API_KEY: ${{ secrets.MESSAGING_API_KEY }}
          PHONEPE_CLIENT_ID: ${{ secrets.PHONEPE_CLIENT_ID }}
          PHONEPE_CLIENT_SECRET: ${{ secrets.PHONEPE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_BROADCASTER_REFRESH_TOKEN: ${{ secrets.YOUTUBE_BROADCASTER_REFRESH_TOKEN }}
          YOUTUBE_BROADCASTER_CHANNEL_ID: ${{ secrets.YOUTUBE_BROADCASTER_CHANNEL_ID }}
        run: |
          required_keys=(
            MONGODB_URL MONGODB_DB_NAME REDIS_URL AZURE_SERVICE_BUS_CONNECTION_STRING
            SECRET_KEY MESSAGING_API_URL MESSAGING_API_SESSION MESSAGING_API_KEY
            PHONEPE_CLIENT_ID PHONEPE_CLIENT_SECRET YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET
            YOUTUBE_BROADCASTER_REFRESH_TOKEN YOUTUBE_BROADCASTER_CHANNEL_ID
          )
          for key in "${required_keys[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Required secret '${key}' is missing."
              exit 1
            fi
          done
          az webapp config connection-string set \
            --name "${APP_NAME}" \
            --resource-group "${RG}" \
            --connection-string-type Custom \
            --settings \
              MONGODB_URL="${MONGODB_URL}" \
              MONGODB_DB_NAME="${MONGODB_DB_NAME}" \
              REDIS_URL="${REDIS_URL}" \
              AZURE_SERVICE_BUS_CONNECTION_STRING="${AZURE_SERVICE_BUS_CONNECTION_STRING}" \
              SECRET_KEY="${SECRET_KEY}" \
              MESSAGING_API_URL="${MESSAGING_API_URL}" \
              MESSAGING_API_SESSION="${MESSAGING_API_SESSION}" \
              MESSAGING_API_KEY="${MESSAGING_API_KEY}" \
              PHONEPE_CLIENT_ID="${PHONEPE_CLIENT_ID}" \
              PHONEPE_CLIENT_SECRET="${PHONEPE_CLIENT_SECRET}" \
              YOUTUBE_CLIENT_ID="${YOUTUBE_CLIENT_ID}" \
              YOUTUBE_CLIENT_SECRET="${YOUTUBE_CLIENT_SECRET}" \
              YOUTUBE_BROADCASTER_REFRESH_TOKEN="${YOUTUBE_BROADCASTER_REFRESH_TOKEN}" \
              YOUTUBE_BROADCASTER_CHANNEL_ID="${YOUTUBE_BROADCASTER_CHANNEL_ID}"

      - name: Deploy to development Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEB_APP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZ_WEB_APP_PUBLISH_PROFILE }}
          package: release.zip

  build-aks:
    if: ${{ needs.resolve-target.outputs.target_platform == 'AKS' }}
    environment: ${{ inputs.environment == 'development' && 'livesports-dev' || 'livesports-production' }}
    runs-on: ubuntu-latest
    needs: resolve-target
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
    steps:
      - name: Checkout LiveSports
        uses: actions/checkout@v4
        with:
          repository: The-Bike-Rentals/livesports
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GET_CODE_FROM_PRIVATE_REPO }}
          persist-credentials: false

      - name: Compute image tag
        id: image-tag
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          image_tag="$(date -u +'%Y%m%d-%H%M%S')-${short_sha}"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push API image
        working-directory: livesports-python-api
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          image="${ACR_LOGIN_SERVER}/livesports-python-api:${IMAGE_TAG}"
          docker build -t "${image}" -t "${ACR_LOGIN_SERVER}/livesports-python-api:latest" .
          docker push "${image}"
          docker push "${ACR_LOGIN_SERVER}/livesports-python-api:latest"

  deploy-aks:
    if: ${{ needs.resolve-target.outputs.target_platform == 'AKS' }}
    environment: ${{ inputs.environment == 'development' && 'livesports-dev' || 'livesports-production' }}
    runs-on: ubuntu-latest
    needs:
      - build-aks
    steps:
      - name: Checkout LiveSports
        uses: actions/checkout@v4
        with:
          repository: The-Bike-Rentals/livesports
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GET_CODE_FROM_PRIVATE_REPO }}
          persist-credentials: false

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Recreate ACR image pull secret
        env:
          NS: ${{ vars.K8S_NAMESPACE || 'default' }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          token=$(az acr login --name "${ACR_NAME}" --expose-token --output tsv --query accessToken)
          test -n "${token}" || { echo '::error::Failed to obtain ACR access token.'; exit 1; }
          kubectl delete secret livesportsprodimagesecret -n "${NS}" --ignore-not-found
          kubectl create secret docker-registry livesportsprodimagesecret \
            -n "${NS}" \
            --docker-server="${ACR_LOGIN_SERVER}" \
            --docker-username="00000000-0000-0000-0000-000000000000" \
            --docker-password="${token}"

      - name: Render Kubernetes manifests
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ needs.build-aks.outputs.image_tag }}
        run: |
          mkdir -p .rendered
          for manifest in k8/python-api/deployment.yml k8/python-api/service.yml; do
            envsubst '${ACR_LOGIN_SERVER} ${IMAGE_TAG}' < "${manifest}" > ".rendered/$(basename "${manifest}")"
          done

      - name: Recreate API runtime secret
        env:
          NS: ${{ vars.K8S_NAMESPACE || 'default' }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AZURE_SERVICE_BUS_CONNECTION_STRING: ${{ secrets.AZURE_SERVICE_BUS_CONNECTION_STRING }}
          AZURE_SERVICE_BUS_QUEUE: ${{ vars.AZURE_SERVICE_BUS_QUEUE || 'livesports' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ vars.ALGORITHM || 'HS256' }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES || '60' }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.REFRESH_TOKEN_EXPIRE_DAYS || '30' }}
          MESSAGING_API_URL: ${{ secrets.MESSAGING_API_URL }}
          MESSAGING_API_SESSION: ${{ secrets.MESSAGING_API_SESSION }}
          MESSAGING_API_KEY: ${{ secrets.MESSAGING_API_KEY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PHONEPE_CLIENT_ID: ${{ secrets.PHONEPE_CLIENT_ID }}
          PHONEPE_CLIENT_SECRET: ${{ secrets.PHONEPE_CLIENT_SECRET }}
          PHONEPE_CLIENT_VERSION: ${{ vars.PHONEPE_CLIENT_VERSION || '1' }}
          PHONEPE_ENV: ${{ vars.PHONEPE_ENV || 'SANDBOX' }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT || 'production' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_BROADCASTER_REFRESH_TOKEN: ${{ secrets.YOUTUBE_BROADCASTER_REFRESH_TOKEN }}
          YOUTUBE_BROADCASTER_CHANNEL_ID: ${{ secrets.YOUTUBE_BROADCASTER_CHANNEL_ID }}
          YOUTUBE_BROADCASTER_CHANNEL_TITLE: ${{ vars.YOUTUBE_BROADCASTER_CHANNEL_TITLE || 'livesports' }}
          YOUTUBE_POST_LIVE_VIDEO_STATUS: ${{ vars.YOUTUBE_POST_LIVE_VIDEO_STATUS || 'private' }}
        run: |
          kubectl delete secret livesports-secrets -n "${NS}" --ignore-not-found
          kubectl create secret generic livesports-secrets -n "${NS}" \
            --from-literal=mongodb_url="${MONGODB_URL}" \
            --from-literal=mongodb_db_name="${MONGODB_DB_NAME}" \
            --from-literal=redis_url="${REDIS_URL}" \
            --from-literal=azure_service_bus_connection_string="${AZURE_SERVICE_BUS_CONNECTION_STRING}" \
            --from-literal=azure_service_bus_queue="${AZURE_SERVICE_BUS_QUEUE}" \
            --from-literal=secret_key="${SECRET_KEY}" \
            --from-literal=algorithm="${ALGORITHM}" \
            --from-literal=access_token_expire_minutes="${ACCESS_TOKEN_EXPIRE_MINUTES}" \
            --from-literal=refresh_token_expire_days="${REFRESH_TOKEN_EXPIRE_DAYS}" \
            --from-literal=messaging_api_url="${MESSAGING_API_URL}" \
            --from-literal=messaging_api_session="${MESSAGING_API_SESSION}" \
            --from-literal=messaging_api_key="${MESSAGING_API_KEY}" \
            --from-literal=cors_origins="${CORS_ORIGINS}" \
            --from-literal=phonepe_client_id="${PHONEPE_CLIENT_ID}" \
            --from-literal=phonepe_client_secret="${PHONEPE_CLIENT_SECRET}" \
            --from-literal=phonepe_client_version="${PHONEPE_CLIENT_VERSION}" \
            --from-literal=phonepe_env="${PHONEPE_ENV}" \
            --from-literal=backend_base_url="${BACKEND_BASE_URL}" \
            --from-literal=frontend_base_url="${FRONTEND_BASE_URL}" \
            --from-literal=environment="${APP_ENVIRONMENT}" \
            --from-literal=youtube_client_id="${YOUTUBE_CLIENT_ID}" \
            --from-literal=youtube_client_secret="${YOUTUBE_CLIENT_SECRET}" \
            --from-literal=youtube_broadcaster_refresh_token="${YOUTUBE_BROADCASTER_REFRESH_TOKEN}" \
            --from-literal=youtube_broadcaster_channel_id="${YOUTUBE_BROADCASTER_CHANNEL_ID}" \
            --from-literal=youtube_broadcaster_channel_title="${YOUTUBE_BROADCASTER_CHANNEL_TITLE}" \
            --from-literal=youtube_post_live_video_status="${YOUTUBE_POST_LIVE_VIDEO_STATUS}"

      - name: Deploy API to AKS
        env:
          NS: ${{ vars.K8S_NAMESPACE || 'default' }}
        run: |
          kubectl apply -n "${NS}" -f .rendered/deployment.yml
          kubectl apply -n "${NS}" -f .rendered/service.yml
          kubectl rollout restart -n "${NS}" deployment/livesports-python-api
          kubectl rollout status -n "${NS}" deployment/livesports-python-api --timeout=5m