name: LiveSports UI Pipeline

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to deploy from the private LiveSports repository
        required: true
        default: development
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private UI workflow
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        with:
          github-token: ${{ secrets.GET_CODE_FROM_PRIVATE_REPO }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'The-Bike-Rentals',
              repo: 'livesports',
              workflow_id: 'ui-deploy.yml',
              ref: process.env.TARGET_BRANCH
            });
