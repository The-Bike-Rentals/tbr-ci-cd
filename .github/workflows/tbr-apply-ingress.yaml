# This is a basic workflow to help you get started with Actions

name: TBR Ingress

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
      
  DEV:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: 'LOGIN TO AZURE'
        uses: azure/login@v2
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set K8 Context
        uses: Azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AZ_K8_CLUSTER_NAME }}
          resource-group: ${{ secrets.AZ_K8_CLUSTER_RG }}

      - name: Replace Image name in Manifest folder
        run: |
          sed -i 's|substitute_secretname|${{ secrets.AZ_K8_TLS_SECRETNAME }}|g' K8/ingress/ingress.yaml
          sed -i 's|substitute_host|${{ secrets.AZ_K8_INGRESS_HOST }}|g' K8/ingress/ingress.yaml

      - name: Apply To K8
        uses: Azure/k8s-deploy@v5
        with:
          namespace: '${{ secrets.AZ_K8_NAMESPACE }}'
          manifests: |
              K8/ingress
  PROD:
    if: inputs.target_branch == 'releases/release5'
    runs-on: ubuntu-latest
    environment: production
    needs: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: 'LOGIN TO AZURE'
        uses: azure/login@v2
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set K8 Context
        uses: Azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AZ_K8_CLUSTER_NAME }}
          resource-group: ${{ secrets.AZ_K8_CLUSTER_RG }}

      - name: Replace Image name in Manifest folder
        run: |
          sed -i 's|substitute_secretname|${{ secrets.AZ_K8_TLS_SECRETNAME }}|g' K8/ingress/ingress.yaml
          sed -i 's|substitute_host|${{ secrets.AZ_K8_INGRESS_HOST }}|g' K8/ingress/ingress.yaml

      - name: Apply To K8
        uses: Azure/k8s-deploy@v5
        with:
          namespace: '${{ secrets.AZ_K8_NAMESPACE }}'
          manifests: |
              K8/ingress
