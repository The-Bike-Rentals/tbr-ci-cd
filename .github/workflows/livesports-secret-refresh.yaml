name: LiveSports AKS Secret Refresh Pipeline

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch whose private AKS environment should be refreshed
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private AKS secret refresh workflow
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        with:
          github-token: ${{ secrets.GET_CODE_FROM_PRIVATE_REPO }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'The-Bike-Rentals',
              repo: 'livesports',
              workflow_id: 'api-nightly-secret-update.yml',
              ref: process.env.TARGET_BRANCH
            });